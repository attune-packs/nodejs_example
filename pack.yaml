# Node.js Example Pack
# Demonstrates Node.js actions, sensors, triggers, and keystore integration

ref: nodejs_example
label: "Node.js Example Pack"
description: "Example pack demonstrating Node.js actions, a counter sensor with keystore integration, and HTTP requests"
version: "1.0.1"
license: MIT
author: "Attune Team"
email: "support@attune.io"

system: false
enabled: true

# Pack metadata
meta:
  category: "examples"
  keywords:
    - "nodejs"
    - "javascript"
    - "examples"
    - "counter"
    - "sensor"
    - "keystore"
    - "http"
  node_dependencies:
    - "node-fetch@^3.3.0"
    - "amqplib@^0.10.0"
  documentation_url: "https://github.com/attune-automation/pack-nodejs-example"
  repository_url: "https://github.com/attune-automation/pack-nodejs-example"

# Tags for categorization
tags:
  - nodejs
  - javascript
  - examples
  - counter
  - sensor
  - http

# Runtime dependencies
runtime_deps:
  - nodejs

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    release:
      type: unittest
      entry_point: tests/test_release.py
      timeout: 60
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block

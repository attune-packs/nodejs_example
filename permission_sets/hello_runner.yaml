# Node.js Example Pack — Hello Runner
# The narrowest possible permission set: execute only the Hello Node.js action
# and view the resulting executions. No other access is granted.

ref: nodejs_example.hello_runner
label: "Node.js Example - Hello Runner"
description: "Execute the Hello Node.js action and view its executions. No access to any other action or resource in the pack."

grants:
  # Only the hello action — scoped by ref, not by pack
  - resource: actions
    actions: [read, execute]
    constraints:
      refs: [nodejs_example.hello]

  # Executions produced by this pack's actions — scoped to the pack so the
  # runner can monitor their hello execution without seeing unrelated runs
  - resource: executions
    actions: [read]
    constraints:
      pack_refs: [nodejs_example]
